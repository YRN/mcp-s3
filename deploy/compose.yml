# Example deployment: mcp-s3 (HTTP mode) behind Caddy, which terminates HTTPS on port 443 with an
# automatic Let's Encrypt certificate. claude.ai custom connectors require public HTTPS on 443.
#
#   cp deploy/mcp-s3.env.example deploy/mcp-s3.env   # fill in, never commit
#   MCP_S3_DOMAIN=mcp.example.com docker compose -f deploy/compose.yml up -d --build
#
# Requirements: a DNS A/AAAA record for MCP_S3_DOMAIN pointing at this host, and ports 80
# (ACME HTTP challenge) and 443 reachable from the internet. Only Caddy publishes ports; the
# mcp-s3 container is reachable from Caddy over the internal network only.
#
# Connect: MCP server URL https://<MCP_S3_DOMAIN>/mcp (OAuth login with
# MCP_S3_AUTH_USERNAME / MCP_S3_AUTH_PASSWORD).
name: mcp-s3

services:
  mcp-s3:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mcp-s3:latest
    restart: unless-stopped
    env_file: mcp-s3.env
    environment:
      MCP_S3_TRANSPORT: http
      MCP_S3_HTTP_HOST: 0.0.0.0
      MCP_S3_HTTP_PORT: "3000"
      MCP_S3_PUBLIC_URL: https://${MCP_S3_DOMAIN:?set MCP_S3_DOMAIN, e.g. mcp.example.com}
      # Caddy is the single proxy hop in front of the server; its X-Forwarded-For entry is the
      # real client IP (used by the login rate limit).
      MCP_S3_TRUST_PROXY: "1"
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      mcp-s3:
        condition: service_healthy
    environment:
      MCP_S3_DOMAIN: ${MCP_S3_DOMAIN:?set MCP_S3_DOMAIN, e.g. mcp.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal: {}

volumes:
  caddy_data: {}
  caddy_config: {}
