# Example deployment: mcp-s3 (HTTP mode) behind Caddy, which terminates HTTPS on port 443 with an
# automatic Let's Encrypt certificate. claude.ai custom connectors require public HTTPS on 443.
#
#   cp deploy/mcp-s3.env.example deploy/mcp-s3.env   # fill in, never commit
#   MCP_S3_DOMAIN=mcp.example.com docker compose -f deploy/compose.yml up -d --build
#
# Requirements: a DNS A/AAAA record for MCP_S3_DOMAIN pointing at this host, and ports 80
# (ACME HTTP challenge) and 443 reachable from the internet. Only Caddy publishes ports; the
# mcp-s3 container is reachable from Caddy over the internal network only.
#
# Connect: MCP server URL https://<MCP_S3_DOMAIN>/mcp (OAuth login with
# MCP_S3_AUTH_USERNAME / MCP_S3_AUTH_PASSWORD).
name: mcp-s3

services:
  mcp-s3:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mcp-s3:latest
    restart: unless-stopped
    env_file: mcp-s3.env
    environment:
      MCP_S3_TRANSPORT: http
      MCP_S3_HTTP_HOST: 0.0.0.0
      MCP_S3_HTTP_PORT: "3000"
      MCP_S3_PUBLIC_URL: https://${MCP_S3_DOMAIN:?set MCP_S3_DOMAIN, e.g. mcp.example.com}
      # Caddy is the single proxy hop in front of the server; its X-Forwarded-For entry is the
      # real client IP (used by the login rate limit).
      MCP_S3_TRUST_PROXY: "1"
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # Optional audit log database: add `--profile audit-db`, set MCP_S3_AUDIT_DB_PASSWORD in the
  # shell (like MCP_S3_DOMAIN), and set MCP_S3_AUDIT_DATABASE_URL in mcp-s3.env (see
  # mcp-s3.env.example). Not published; only reachable on the internal network.
  postgres:
    image: postgres:16-alpine
    profiles: ["audit-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp_s3
      POSTGRES_PASSWORD: ${MCP_S3_AUDIT_DB_PASSWORD:-}
      POSTGRES_DB: mcp_s3
    volumes:
      - audit_data:/var/lib/postgresql/data
    networks:
      - internal

  # One-off: creates/updates the audit table. Run it before the first start with the audit
  # database and after upgrades that add migrations:
  #   docker compose -f deploy/compose.yml --profile audit-db --profile migrate run --rm migrate
  # The server never runs migrations itself. Needs a database user that may create tables.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    image: mcp-s3-migrate:latest
    profiles: ["migrate"]
    env_file: mcp-s3.env
    depends_on:
      - postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      mcp-s3:
        condition: service_healthy
    environment:
      MCP_S3_DOMAIN: ${MCP_S3_DOMAIN:?set MCP_S3_DOMAIN, e.g. mcp.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal: {}

volumes:
  audit_data: {}
  caddy_data: {}
  caddy_config: {}
